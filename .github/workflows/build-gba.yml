
name: Build Pokemon Rockstar GBA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make git python3
          arm-none-eabi-gcc --version

      - name: Locate game source
        id: source
        run: |
          if [ -f src/Makefile ]; then
            echo "directory=src" >> "$GITHUB_OUTPUT"
          elif [ -f Makefile ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          else
            echo "Upload Emerald Expansion source first"
            exit 1
          fi

      - name: Compile GBA
        working-directory: ${{ steps.source.outputs.directory }}
        run: make -j2

      - name: Upload GBA
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Rockstar-GBA
          path: '**/*.gba'
          if-no-files-found: error
          
