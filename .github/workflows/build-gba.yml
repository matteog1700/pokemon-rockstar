name: Build Pokemon Rockstar GBA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gba.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-compiler:
    name: Verify portable ARM compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install portable ARM compiler (no apt mirror needed)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=12.3.1-1.2
          NAME=xpack-arm-none-eabi-gcc-${VERSION}-linux-x64.tar.gz
          BASE=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${VERSION}
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 450 \
            -o /tmp/rockstar-arm.tar.gz "$BASE/$NAME"
          tar -xzf /tmp/rockstar-arm.tar.gz -C /tmp
          echo "/tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin" >> "$GITHUB_PATH"
          /tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin/arm-none-eabi-gcc --version
          /tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin/arm-none-eabi-ld --version | head -n 1

      - name: Export verified compiler archive for offline compilation
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-rockstar-arm-compiler
          path: /tmp/rockstar-arm.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build:
    if: github.event_name != 'push'
    needs: verify-compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test randomized town planning and map export
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_town_pipeline.py' -v

      - name: Locate or download game source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f game/Makefile ]]; then
            dir="game"
          elif [[ -f Makefile && -f config.mk ]]; then
            dir="."
          else
            mkdir -p .source-archive .source-extracted
            echo "No checked-in Emerald source found. Looking for the source ZIP on a GitHub Release."
            if [[ -n "$RELEASE_TAG" ]]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Pokemon_Rockstar_Source_Character_Intro_Patched.zip' --dir .source-archive || {
                echo "::error::Attach Pokemon_Rockstar_Source_Character_Intro_Patched.zip to this release before publishing it."
                exit 1
              }
            else
              gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Pokemon_Rockstar_Source_Character_Intro_Patched.zip' --dir .source-archive || {
                echo "::error::No release source archive found. Create a GitHub Release and attach Pokemon_Rockstar_Source_Character_Intro_Patched.zip."
                exit 1
              }
            fi
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path(".source-archive/Pokemon_Rockstar_Source_Character_Intro_Patched.zip")
          with ZipFile(source) as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe archive path: {entry.filename}")
              archive.extractall(".source-extracted")
          PY
            if [[ -f .source-extracted/pokeemerald-expansion-master/Makefile ]]; then
              mv .source-extracted/pokeemerald-expansion-master game
              dir="game"
            elif [[ -f .source-extracted/Makefile ]]; then
              mv .source-extracted game
              dir="game"
            else
              echo "::error::Source ZIP does not contain a recognized Emerald Expansion Makefile."
              exit 1
            fi
          fi
          test -f "$dir/Makefile" || { echo "::error::Missing Makefile"; exit 1; }
          test -f "$dir/config.mk" || { echo "::error::Missing config.mk"; exit 1; }
          test -d "$dir/graphics" || { echo "::error::Missing game graphics source"; exit 1; }
          echo "directory=$dir" >> "$GITHUB_OUTPUT"
          echo "Source found: $dir"

      - name: Integrate Rockstar choice into actual game source
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          speech = Path("data/text/birch_speech.inc")
          menu = Path("src/main_menu.c")
          for p in (speech, menu):
              if not p.is_file():
                  raise SystemExit(f"Required game source missing: {p}")

          s = speech.read_text()
          old = 'gText_Birch_BoyOrGirl::\n\t.string "Are you a boy?\\n"\n\t.string "Or are you a girl?$"'
          new = 'gText_Birch_BoyOrGirl::\n\t.string "Choose your ROCKSTAR:\\n"\n\t.string "LIL PEEP or TOO POOR?$"'
          if old in s:
              speech.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit("Cannot locate original Birch selection prompt")

          s = menu.read_text()
          old = 'static const struct MenuAction sMenuActions_Gender[] = {\n    {gText_Boy, {NULL}},\n    {gText_Girl, {NULL}}\n};'
          new = 'static const u8 sRockstarLilPeep[] = _("LIL PEEP");\nstatic const u8 sRockstarTooPoor[] = _("TOO POOR");\n\nstatic const struct MenuAction sMenuActions_Gender[] = {\n    {sRockstarLilPeep, {NULL}},\n    {sRockstarTooPoor, {NULL}}\n};'
          if old in s:
              menu.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit("Cannot locate original character-choice menu")

          # Ozzy Osbourne is the professor in the introduction, not Birch.
          intro = speech.read_text()
          old_name = 'My name is BIRCH.'
          new_name = 'I am OZZY OSBOURNE.'
          if old_name in intro:
              intro = intro.replace(old_name, new_name, 1)
          elif new_name not in intro:
              raise SystemExit("Could not locate professor's introduction name")
          speech.write_text(intro)
          assert new_name in speech.read_text()
          assert 'LIL PEEP or TOO POOR?' in speech.read_text()
          assert '{sRockstarLilPeep, {NULL}}' in menu.read_text()
          assert '{sRockstarTooPoor, {NULL}}' in menu.read_text()
          print("Verified in-game Rockstar character-choice source integration")
          PY

      - name: Install portable ARM compiler (no apt mirror needed)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=12.3.1-1.2
          NAME=xpack-arm-none-eabi-gcc-${VERSION}-linux-x64.tar.gz
          BASE=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${VERSION}
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 450 \
            -o /tmp/rockstar-arm.tar.gz "$BASE/$NAME"
          tar -xzf /tmp/rockstar-arm.tar.gz -C /tmp
          echo "/tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin" >> "$GITHUB_PATH"
          /tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin/arm-none-eabi-gcc --version
          /tmp/xpack-arm-none-eabi-gcc-${VERSION}/bin/arm-none-eabi-ld --version | head -n 1

      - name: Verify host PNG build dependency
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --modversion libpng
          python3 --version

      - name: Compile Pokemon Emerald Expansion
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          make -j2

      - name: Verify compiled GBA ROM
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rom = Path("pokeemerald.gba")
          if not rom.is_file():
              raise SystemExit("Build did not produce pokeemerald.gba")
          size = rom.stat().st_size
          if not (1024 * 1024 <= size <= 32 * 1024 * 1024):
              raise SystemExit(f"Unexpected GBA ROM size: {size} bytes")
          with rom.open("rb") as file:
              header = file.read(0xC0)
          if header[0xB2] != 0x96:
              raise SystemExit("Invalid GBA fixed-header byte (offset 0xB2)")
          print(f"Compiled GBA ROM found: {size:,} bytes, header check passed")
          PY
          sha256sum pokeemerald.gba

      - name: Upload compiled GBA (only on success)
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Rockstar-GBA
          path: ${{ steps.source.outputs.directory }}/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
