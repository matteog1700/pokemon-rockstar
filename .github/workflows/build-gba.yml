name: Build Pokemon Rockstar GBA

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or download game source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f game/Makefile ]]; then
            dir="game"
          elif [[ -f Makefile && -f config.mk ]]; then
            dir="."
          else
            mkdir -p .source-archive .source-extracted
            echo "No checked-in Emerald source found. Looking for the source ZIP on a GitHub Release."
            if [[ -n "$RELEASE_TAG" ]]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Pokemon_Rockstar_Source_REUPLOAD_2026-11-11.zip' --dir .source-archive || {
                echo "::error::Attach Pokemon_Rockstar_Source_REUPLOAD_2026-11-11.zip to this release before publishing it."
                exit 1
              }
            else
              gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Pokemon_Rockstar_Source_REUPLOAD_2026-11-11.zip' --dir .source-archive || {
                echo "::error::No release source archive found. Create a GitHub Release and attach Pokemon_Rockstar_Source_REUPLOAD_2026-11-11.zip."
                exit 1
              }
            fi
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path(".source-archive/Pokemon_Rockstar_Source_REUPLOAD_2026-11-11.zip")
          with ZipFile(source) as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe archive path: {entry.filename}")
              archive.extractall(".source-extracted")
          PY
            if [[ -f .source-extracted/pokeemerald-expansion-master/Makefile ]]; then
              mv .source-extracted/pokeemerald-expansion-master game
              dir="game"
            elif [[ -f .source-extracted/Makefile ]]; then
              mv .source-extracted game
              dir="game"
            else
              echo "::error::Source ZIP does not contain a recognized Emerald Expansion Makefile."
              exit 1
            fi
          fi
          test -f "$dir/Makefile" || { echo "::error::Missing Makefile"; exit 1; }
          test -f "$dir/config.mk" || { echo "::error::Missing config.mk"; exit 1; }
          test -d "$dir/graphics" || { echo "::error::Missing game graphics source"; exit 1; }
          echo "directory=$dir" >> "$GITHUB_OUTPUT"
          echo "Source found: $dir"

      - name: Integrate Rockstar choice into actual game source
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          speech = Path("data/text/birch_speech.inc")
          menu = Path("src/main_menu.c")
          for p in (speech, menu):
              if not p.is_file():
                  raise SystemExit(f"Required game source missing: {p}")
          s = speech.read_text()
          pattern = r'(gText_Birch_BoyOrGirl::\\s*\\n)(?:[ \\t]*\\.string[^\\n]*\\n){2}'
          replacement = 'gText_Birch_BoyOrGirl::\\n\\t.string "Choose your ROCKSTAR:\\\\n"\\n\\t.string "LIL PEEP or TOO POOR?$"\\n'
          updated, count = re.subn(pattern, lambda _: replacement, s, count=1)
          if count != 1 and 'LIL PEEP or TOO POOR?' not in s:
              raise SystemExit("Cannot locate Birch selection prompt; inspect upstream source")
          speech.write_text(updated if count else s)

          s = menu.read_text()
          old = 'static const struct MenuAction sMenuActions_Gender[] = {\\n    {gText_Boy, {NULL}},\\n    {gText_Girl, {NULL}}\\n};'
          new = 'static const u8 sRockstarLilPeep[] = _("LIL PEEP");\\nstatic const u8 sRockstarTooPoor[] = _("TOO POOR");\\n\\nstatic const struct MenuAction sMenuActions_Gender[] = {\\n    {sRockstarLilPeep, {NULL}},\\n    {sRockstarTooPoor, {NULL}}\\n};'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Cannot locate character-choice menu; inspect upstream source")
          menu.write_text(s)
          print("Character selection prompt and actual two-item menu patched in game source")
          PY

      - name: Install ARM build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 make git
          arm-none-eabi-gcc --version
          arm-none-eabi-ld --version | head -n 1

      - name: Compile Pokemon Emerald Expansion
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          make -j2

      - name: Verify compiled GBA ROM
        working-directory: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rom = Path("pokeemerald.gba")
          if not rom.is_file():
              raise SystemExit("Build did not produce pokeemerald.gba")
          size = rom.stat().st_size
          if not (1024 * 1024 <= size <= 32 * 1024 * 1024):
              raise SystemExit(f"Unexpected GBA ROM size: {size} bytes")
          with rom.open("rb") as file:
              header = file.read(0xC0)
          if header[0xB2] != 0x96:
              raise SystemExit("Invalid GBA fixed-header byte (offset 0xB2)")
          print(f"Compiled GBA ROM found: {size:,} bytes, header check passed")
          PY
          sha256sum pokeemerald.gba

      - name: Upload compiled GBA (only on success)
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Rockstar-GBA
          path: ${{ steps.source.outputs.directory }}/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
